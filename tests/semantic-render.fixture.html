<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css?v=20260907-semantic-color-fix-2" />
  </head>
  <body>
    <main class="content-area">
      <section class="continue-main-card continue-recommendation-card">
        <span class="continue-phase-chip phase-pre-notice">Pré-edital</span>
        <div class="continue-reason-box"><div class="continue-reason-heading"><strong>Por que este tema agora?</strong></div></div>
        <div class="continue-meta-grid">
          <div class="continue-meta-cycle"><span>Posição no ciclo</span><strong>Bloco 5 de 17</strong></div>
          <div class="continue-meta-activity"><span>Atividade sugerida</span><span class="semantic-activity activity-study"><span>Estudo</span></span></div>
          <div class="continue-meta-status"><span>Status</span><span class="ds-badge status-badge nao-iniciado status-neutral">Não iniciado</span></div>
          <div class="continue-meta-priority"><span>Prioridade</span><span class="priority-indicator priority-level-5"><span class="priority-dots"><span class="dot filled"></span><span class="dot filled"></span><span class="dot filled"></span><span class="dot filled"></span><span class="dot filled"></span></span><span>Prioridade 5</span></span></div>
        </div>
        <div class="continue-actions"><button class="primary-button study-play-button">Começar estudo</button></div>
      </section>
      <section class="cycle-goals-list">
        <article class="cycle-goal-card cycle-activity-study">
          <div class="goal-card-index"><strong>6</strong></div>
          <div class="goal-card-main">
            <div class="goal-card-title"><span>Matéria</span><strong>Tema de demonstração</strong></div>
            <div class="goal-card-meta">
              <span class="semantic-activity activity-study cycle-type-badge"><span>Estudo</span></span>
              <label class="goal-duration-field"><input class="goal-duration-input" value="1h30" /></label>
              <div class="goal-status"><span>Status</span><span class="ds-badge status-badge nao-iniciado status-neutral">Não iniciado</span></div>
              <div class="goal-priority"><span>Prioridade</span><span class="priority-indicator priority-level-5"><span class="priority-dots"><span class="dot filled"></span><span class="dot filled"></span><span class="dot filled"></span><span class="dot filled"></span><span class="dot filled"></span></span><span>Prioridade 5</span></span></div>
            </div>
            <div class="goal-card-actions"><button class="primary-button compact-button study-play-button">Iniciar estudo</button></div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
